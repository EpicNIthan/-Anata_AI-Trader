name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paper-pipeline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: paper
      ENABLE_SERVER_TRAINING: "false"
      ENABLE_SERVER_INFERENCE: "true"
      EXTERNAL_AI_ENABLED: "false"
      NEWS_MOCK_FALLBACK_ENABLED: "false"
      DATABASE_URL: sqlite:///./ci_trading_lab.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install production dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app scripts tests

      - name: Run deterministic unit contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify paper-only application import
        run: python -c "from app.main import app; assert app.title"
